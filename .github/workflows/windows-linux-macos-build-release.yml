name: Build on Windows, Linux and macOS and create a release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on:  ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15, macos-15-intel]
        include:
          - os: windows-latest
            test_cmd: .\BaM.exe --version
          - os: ubuntu-latest
            test_cmd: ./BaM --version
          # macOS is built once per architecture; the two slices are combined
          # into a single universal binary by the `macos-universal` job below.
          # Both use a macOS 15 image on purpose: the SDK a slice is built
          # against sets its minimum-OS stamp, so building the arm64 slice on
          # macos-latest (macOS 26) would stamp it minos 26.0 and the universal
          # binary would refuse to launch on Apple Silicon Macs running
          # anything older than macOS 26.
          - os: macos-15
            test_cmd: ./BaM --version
            slice: arm64
          - os: macos-15-intel
            test_cmd: ./BaM --version
            slice: x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install MSYS2 (Windows only)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: mingw-w64-x86_64-gcc-fortran make

      - name: Install gfortran (macOS only)
        if: runner.os == 'macOS'
        run: |
          brew install gcc
          GF_BIN="$(ls $(brew --prefix)/bin/gfortran-* 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$GF_BIN" ]; then
            echo "gfortran binary not found in $(brew --prefix)/bin" >&2
            exit 1
          fi
          sudo mkdir -p /usr/local/bin
          sudo ln -sf "$GF_BIN" /usr/local/bin/gfortran
          echo "Symlinked $GF_BIN -> /usr/local/bin/gfortran"

      - name: Verify gfortran
        run: gfortran --version
        shell: bash

      - name: Install dependencies
        run: |
          cd ..
          git clone https://github.com/benRenard/miniDMSL.git miniDMSL 
          git clone https://github.com/benRenard/BMSL.git BMSL 
        shell: bash

      - name: Call make (Linux)
        if: runner.os == 'Linux'
        run: |
          cd makefile
          make

      - name: Call make (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cd makefile
          make

      # SDKROOT is set explicitly: a Homebrew gfortran built against a previous
      # Command Line Tools release otherwise fails with "ld: library 'System' not found".
      - name: Call make (macOS)
        if: runner.os == 'macOS'
        run: |
          export SDKROOT="$(xcrun --show-sdk-path)"
          cd makefile
          make

      - name: Test executable
        run: |
          cd makefile
          ${{ matrix.test_cmd }}

      - name: Zip artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          cd makefile/
          zip "BaM-${VERSION}_Linux.zip" BaM

      - name: Zip artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          $VERSION = "${env:GITHUB_REF}".Replace("refs/tags/", "")
          cd makefile
          Compress-Archive -Path BaM.exe -DestinationPath "BaM-${VERSION}_Windows.zip"

      - name: Rename macOS slice
        if: runner.os == 'macOS'
        run: |
          cd makefile
          mv BaM "BaM-${{ matrix.slice }}"

      - name: Upload release zip (Windows / Linux)
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: BaM-${{ matrix.os }}
          path: makefile/BaM-*.zip

      - name: Upload macOS slice
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: BaM-macos-slice-${{ matrix.slice }}
          path: makefile/BaM-${{ matrix.slice }}

  # Combine the Intel and Apple Silicon builds into ONE universal binary.
  # A single macOS asset is deliberate: RBaM's downloadBaM() selects a release
  # asset by grepping for Sys.info()["sysname"] (= "Darwin" on macOS) and errors
  # out if more than one asset matches, so shipping two per-architecture zips
  # would break automatic download for every Mac user.
  macos-universal:
    runs-on: macos-15
    needs: build
    steps:
      - name: Download macOS slices
        uses: actions/download-artifact@v4
        with:
          pattern: BaM-macos-slice-*
          path: slices
          merge-multiple: true

      - name: Create universal binary
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          chmod +x slices/BaM-arm64 slices/BaM-x86_64
          lipo -create -output BaM slices/BaM-arm64 slices/BaM-x86_64
          lipo -info BaM
          ./BaM --version
          zip "BaM-${VERSION}_Darwin.zip" BaM

      - uses: actions/upload-artifact@v4
        with:
          name: BaM-macos-universal
          path: BaM-*.zip

  release:
    runs-on: ubuntu-latest
    needs: [build, macos-universal]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BaM ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/**/*.zip
